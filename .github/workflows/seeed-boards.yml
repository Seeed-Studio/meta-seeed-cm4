name: seeed-yocto-boards-build

on:
  workflow_dispatch:
    inputs:
      machine:
        description: Board to build
        required: true
        type: choice
        options:
          - all
          - seeed-recomputer-r100x-mender
          - seeed-recomputer-r110x-mender
          - seeed-reterminal-mender
          - seeed-reterminal-DM-mender
          - seeed-rerouter-cm4-mender
          - seeed-recomputer-r2x-mender
          - seeed-recomputer-r22-mender
        default: all
      tag_name:
        description: Release tag to publish images to (release is created if missing)
        required: false
        type: string
        default: ''

concurrency:
  group: yocto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: en_US.UTF-8

jobs:
  build:
    name: ${{ matrix.machine }}
    runs-on: ubuntu-24.04
    # Cold full builds on the 4-vCPU public runner can take several hours;
    # 360 min is the GitHub Actions job maximum.
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.machine != 'all') && format('["{0}"]', inputs.machine) || '["seeed-recomputer-r100x-mender", "seeed-recomputer-r110x-mender", "seeed-reterminal-mender", "seeed-reterminal-DM-mender", "seeed-rerouter-cm4-mender", "seeed-recomputer-r2x-mender", "seeed-recomputer-r22-mender"]') }}

    steps:
      - name: Checkout layer
        uses: actions/checkout@v5
        with:
          path: layers/meta-seeed-cm4

      - name: Free up runner disk space
        run: |
          # Strip the large preinstalled toolchains and images the Yocto
          # build never uses. Tolerate missing packages.
          sudo apt-get remove -yq \
            '^dotnet-.*' '^llvm-.*' 'php.*' \
            azure-cli google-cloud-sdk firefox google-chrome-stable \
            powershell mono-complete > /dev/null 2>&1 || true
          sudo apt-get autoremove -y > /dev/null 2>&1 || true
          sudo apt-get clean
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" \
            /usr/local/lib/android /usr/local/share/boost \
            /usr/share/dotnet /usr/share/swift \
            /opt/ghc /usr/local/.ghcup
          # Preloaded container images (~3 GiB); nothing in this job uses docker.
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /

      - name: Install Yocto host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential chrpath cpio diffstat file gawk git \
            iputils-ping libacl1 libegl1 lz4 libsdl2-dev \
            mesa-common-dev pylint python3 python3-git python3-jinja2 \
            python3-pexpect python3-subunit socat texinfo unzip \
            wget xterm xz-utils zstd locales
          sudo pip3 install kas
          kas --version

      - name: Enable BitBake user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Some layer scripts expect bash as /bin/sh.
          sudo rm -f /bin/sh && sudo ln -s bash /bin/sh

      - name: Restore Yocto sstate cache
        uses: actions/cache/restore@v4
        with:
          path: build/sstate-cache
          key: yocto-wrynose-${{ matrix.machine }}-sstate-${{ github.sha }}
          restore-keys: |
            yocto-wrynose-${{ matrix.machine }}-sstate-
          # A miss is a normal cold start; the action only warns.

      - name: Build image
        # Cap the build step below the 360 min job maximum so the sstate
        # banking steps below run in a live job with a real time budget
        # instead of the ~5 min post-cancellation grace window.
        timeout-minutes: 330
        env:
          KAS_WORK_DIR: ${{ github.workspace }}
        run: |
          kas build \
            "layers/meta-seeed-cm4/kas/${{ matrix.machine }}.yml:layers/meta-seeed-cm4/kas/ci.yml"
          df -h /

      - name: Upload deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-${{ matrix.machine }}
          path: build/tmp/deploy/images/${{ matrix.machine }}/
          if-no-files-found: error
          retention-days: 14

      - name: Prune sstate cache
        # Keep the banked cache small: the actions/cache quota is shared
        # across all machines in this repository.
        if: always()
        run: |
          if [ -f layers/openembedded-core/scripts/sstate-cache-management.py ]; then
            if [ -d build/tmp/stamps ]; then
              python3 layers/openembedded-core/scripts/sstate-cache-management.py -y -v \
                --cache-dir=build/sstate-cache \
                --stamps-dir=build/tmp/stamps \
                || echo "WARNING: unused-sstate cleanup failed"
            fi
            python3 layers/openembedded-core/scripts/sstate-cache-management.py -y -v \
              --cache-dir=build/sstate-cache \
              --remove-duplicated \
              || echo "WARNING: duplicate-sstate cleanup failed"
          else
            echo "sstate-cache-management.py not found, skipping cleanup"
          fi
          du -sh build/sstate-cache || true

      - name: Bank sstate cache
        # Runs after timeouts and failed builds too, so the next run
        # resumes warm (two-run convergence). Tolerate an exact-key hit.
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/sstate-cache
          key: yocto-wrynose-${{ matrix.machine }}-sstate-${{ github.sha }}

      - name: Upload release assets
        if: ${{ inputs.tag_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag_name }}"
          # Create the release if it does not exist yet; tolerate a
          # concurrent matrix job winning the race.
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
                 --target "$GITHUB_SHA" --title "$TAG" \
                 --notes "Automated image build @ ${GITHUB_SHA}" \
            || true
          DEPLOY="build/tmp/deploy/images/${{ matrix.machine }}"
          files=$(cd "$DEPLOY" && ls -1 *.mender *.sdimg *.sdimg.gz *.wic *.wic.gz *.wic.bz2 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "ERROR: no image files found in $DEPLOY"
            exit 1
          fi
          echo "Uploading to release $TAG:"
          echo "$files"
          cd "$DEPLOY"
          # shellcheck disable=SC2086
          gh release upload "$TAG" $files --clobber -R "$GITHUB_REPOSITORY"
