# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-seeed-cm4"
BBFILE_PATTERN_meta-seeed-cm4 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-seeed-cm4 = "6"

LICENSE_PATH = "${LAYERDIR}/licenses/"

LAYERDEPENDS_meta-reterminal = "core"
LAYERSERIES_COMPAT_meta-reterminal = "scarthgap"

# The libcamera-apps recipe only exists when meta-multimedia is in
# bblayers (meta-raspberrypi gates it behind its own multimedia-layer
# dynamic-layer), so gate our bbappend the same way - a bare bbappend
# breaks parse on every machine without meta-multimedia.
BBFILES_DYNAMIC += "multimedia-layer:${LAYERDIR}/dynamic-layers/multimedia-layer/recipes-*/*/*.bb \
                    multimedia-layer:${LAYERDIR}/dynamic-layers/multimedia-layer/recipes-*/*/*.bbappend"
