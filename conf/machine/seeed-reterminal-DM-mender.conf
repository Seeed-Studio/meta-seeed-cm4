#@TYPE: Machine
#@NAME: Seeed reterminal plus
#@SOC: broadcom bcm2711
#@DESCRIPTION: Machine configuration for seeed reterminal DM
#@MAINTAINER: jian xiong <953308023@qq.com>

require conf/machine/raspberrypi4-64.conf

# Lowercase alias of the machine name, for use as an override. BitBake
# silently ignores ":append", ":prepend" and ":remove" when the override
# after them contains uppercase letters, so a line such as
#   VAR:append:seeed-reterminal-DM-mender = "..."
# is dropped without a warning. Write it as
#   VAR:append:seeed-reterminal-dm-mender = "..."
# instead. Appended last so it ranks with the machine name itself.
MACHINEOVERRIDES .= ":seeed-reterminal-dm-mender"

# Headless image: drop the graphics distro features so pygobject keeps its
# cairo PACKAGECONFIG off (no cairo/x11/wayland build-time waste).
DISTRO_FEATURES:remove = " x11 wayland vulkan"

PREFERRED_VERSION_linux-raspberrypi ?= "6.1.%"

PACKAGECONFIG:append:pn-qtbase = " eglfs "
KERNEL_MODULE_AUTOLOAD:rpi += "i2c-dev"
ENABLE_I2C = "1"
ENABLE_UART = "1"

# mender conf
MENDER_ARTIFACT_NAME = "release-1"
INHERIT += "mender-full"
RPI_USE_U_BOOT = "1"
MENDER_BOOT_PART_SIZE_MB = "64"
IMAGE_INSTALL:append = " kernel-image kernel-devicetree"
IMAGE_FSTYPES:remove = " rpi-sdimg"
MENDER_FEATURES_ENABLE:append = " mender-uboot mender-image-sd"
MENDER_FEATURES_DISABLE:append = " mender-grub mender-image-uefi"
MENDER_STORAGE_TOTAL_SIZE_MB = "2048"
