#@TYPE: Machine
#@NAME: Seeed reComputer-R22
#@SOC: broadcom bcm2712
#@DESCRIPTION: Machine configuration for seeed reComputer-R22 with Mender support
#@MAINTAINER: ruiqian tang <ruiqian.tang@seeed.cc>

MACHINEOVERRIDES = "raspberrypi5:${MACHINE}"
require conf/machine/raspberrypi5.conf
# Headless image: drop the graphics distro features so pygobject keeps its
# cairo PACKAGECONFIG off (no cairo/x11/wayland build-time waste).
DISTRO_FEATURES:remove = " x11 wayland vulkan"

PREFERRED_VERSION_linux-raspberrypi ?= "6.12%"

# Enable I2C and UART
ENABLE_UART = "1"

# The CH343 debug serial is wired to the RP1 UART0 (GPIO14/15, ttyAMA0),
# not to the SoC debug UART (ttyAMA10) that meta-raspberrypi's Pi5 default
# assumes. console=serial0 never attaches on this board: the RP1 uart only
# registers after PCIe enumeration, and the alias-based preferred console
# is not retried. Name the uart directly so the PL011 console attaches when
# it registers, and give the getty a home there too.
SERIAL_CONSOLES:append = " 115200;ttyAMA0"
CMDLINE_SERIAL = "console=ttyAMA0,115200"

RPI_USE_U_BOOT = "1"
IMAGE_INSTALL:append = " kernel-image kernel-devicetree grub-editenv userlandtools"
IMAGE_FSTYPES:remove = " rpi-sdimg"

# Essential packages for reComputer R22
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "seeed-linux-dtoverlays"
IMAGE_INSTALL:append = " atecc-util sx1302-hal"

# Mender configuration
INHERIT += "mender-full"
MENDER_FEATURES_ENABLE:append = " mender-update-install"
MENDER_ARTIFACT_NAME = "recomputer-r22-release-1"
MENDER_BOOT_PART_SIZE_MB = "100"
MENDER_STORAGE_TOTAL_SIZE_MB = "8192"
MENDER_FEATURES_ENABLE:append = " mender-uboot mender-image-sd"
MENDER_FEATURES_DISABLE:append = " mender-grub mender-image-uefi"

# Boot partition files configuration
# Copy device tree overlay to boot partition
IMAGE_BOOT_FILES:append = " reComputer-R22.dtbo;overlays/reComputer-R22.dtbo "

# Override userlandtools compatibility for this machine
COMPATIBLE_MACHINE:pn-userlandtools = "seeed-recomputer-r22-mender"
